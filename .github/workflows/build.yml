name: Build and Commit PS2 Example ELF

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PS2 ELF
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src output

          python3 - <<'PY'
          from pathlib import Path

          files = {
              ".gitignore": r"""# Generated compiler files
          *.o
          /example.elf
          """,
              "README.md": r"""# PS2 Example ELF

          PS2SDK controller demo.

          - Circle: open the menu.
          - Cross: open the QWERTY keyboard or activate the selected key.
          - D-pad: navigate menus and keyboard keys.
          - Triangle: return to the main screen from any menu.

          The workflow builds and commits `output/example.elf` to this repository.
          """,
              "Makefile": r"""# PS2_EXAMPLE_ELF_V2
          EE_BIN = example.elf
          EE_OBJS = src/main.o
          EE_LIBS = -lpad -ldebug
          EE_CFLAGS += -O2 -G0 -Wall -Wextra

          all: $(EE_BIN)

          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          """,
              "src/main.c": r"""/* PS2_EXAMPLE_ELF_V2 */
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifrpc.h>
          #include <loadfile.h>
          #include <libpad.h>
          #include <debug.h>
          #include <string.h>

          #define HOME_SCREEN 0
          #define MENU_SCREEN 1
          #define KEYBOARD_SCREEN 2
          #define TEXT_CAPACITY 64

          static unsigned char pad_buffer[256] __attribute__((aligned(64)));
          static int screen_mode = HOME_SCREEN;
          static int menu_selection = 0;
          static int key_row = 0;
          static int key_column = 0;
          static char text_field[TEXT_CAPACITY];
          static int text_length = 0;

          static const char *menu_items[] = {
              "Open QWERTY keyboard",
              "Clear text field",
              "Close menu"
          };

          static const char *keyboard_rows[] = {
              "qwertyuiop",
              "asdfghjkl",
              "zxcvbnm"
          };

          static const int keyboard_row_lengths[] = {10, 9, 7, 3};
          static const char *keyboard_actions[] = {"SPACE", "DEL", "DONE"};

          static void draw_home(void)
          {
              scr_clear();
              scr_setXY(0, 0);
              scr_printf("Hello from example elf!\n\n");
              scr_printf("PS2 EXAMPLE ELF\n\n");
              scr_printf("Text field: %s\n\n", text_length ? text_field : "<empty>");
              scr_printf("CIRCLE  - Open menu\n");
              scr_printf("CROSS   - Open QWERTY keyboard\n");
              scr_printf("TRIANGLE - Return to this screen\n\n");
              scr_printf("Built with PS2SDK and GitHub Actions.\n");
          }

          static void draw_menu(void)
          {
              int i;

              scr_clear();
              scr_setXY(0, 0);
              scr_printf("EXAMPLE MENU\n\n");

              for (i = 0; i < 3; ++i)
                  scr_printf("%c %s\n",
                             i == menu_selection ? '>' : ' ',
                             menu_items[i]);

              scr_printf("\nD-PAD - Navigate\n");
              scr_printf("CROSS - Select\n");
              scr_printf("TRIANGLE - Main screen\n");
          }

          static void draw_keyboard(void)
          {
              int row, col;

              scr_clear();
              scr_setXY(0, 0);
              scr_printf("QWERTY KEYBOARD\n\n");
              scr_printf("Text field: %s\n\n", text_field);

              for (row = 0; row < 3; ++row) {
                  int indent = row == 0 ? 0 : (row == 1 ? 2 : 5);

                  for (col = 0; col < indent; ++col)
                      scr_printf(" ");

                  for (col = 0; col < keyboard_row_lengths[row]; ++col) {
                      if (row == key_row && col == key_column)
                          scr_printf("[%c] ", keyboard_rows[row][col]);
                      else
                          scr_printf(" %c  ", keyboard_rows[row][col]);
                  }

                  scr_printf("\n");
              }

              scr_printf("\n");

              for (col = 0; col < 3; ++col) {
                  if (key_row == 3 && key_column == col)
                      scr_printf("[%s]  ", keyboard_actions[col]);
                  else
                      scr_printf(" %s   ", keyboard_actions[col]);
              }

              scr_printf("\n\nD-PAD - Move  CROSS - Choose\n");
              scr_printf("TRIANGLE - Main screen\n");
          }

          static void redraw_screen(void)
          {
              if (screen_mode == HOME_SCREEN)
                  draw_home();
              else if (screen_mode == MENU_SCREEN)
                  draw_menu();
              else
                  draw_keyboard();
          }

          static void append_character(char value)
          {
              if (text_length < TEXT_CAPACITY - 1) {
                  text_field[text_length++] = value;
                  text_field[text_length] = '\0';
              }
          }

          static void update_menu(u32 pressed)
          {
              if (pressed & PAD_UP)
                  menu_selection = (menu_selection + 2) % 3;

              if (pressed & PAD_DOWN)
                  menu_selection = (menu_selection + 1) % 3;

              if (pressed & PAD_CROSS) {
                  if (menu_selection == 0) {
                      screen_mode = KEYBOARD_SCREEN;
                      key_row = 0;
                      key_column = 0;
                  } else if (menu_selection == 1) {
                      text_length = 0;
                      text_field[0] = '\0';
                  } else {
                      screen_mode = HOME_SCREEN;
                  }
              }
          }

          static void update_keyboard(u32 pressed)
          {
              if (pressed & PAD_LEFT)
                  key_column =
                      (key_column + keyboard_row_lengths[key_row] - 1)
                      % keyboard_row_lengths[key_row];

              if (pressed & PAD_RIGHT)
                  key_column =
                      (key_column + 1) % keyboard_row_lengths[key_row];

              if (pressed & PAD_UP) {
                  if (key_row > 0)
                      --key_row;

                  if (key_column >= keyboard_row_lengths[key_row])
                      key_column = keyboard_row_lengths[key_row] - 1;
              }

              if (pressed & PAD_DOWN) {
                  if (key_row < 3)
                      ++key_row;

                  if (key_column >= keyboard_row_lengths[key_row])
                      key_column = keyboard_row_lengths[key_row] - 1;
              }

              if (pressed & PAD_CROSS) {
                  if (key_row < 3) {
                      append_character(
                          keyboard_rows[key_row][key_column]
                      );
                  } else if (key_column == 0) {
                      append_character(' ');
                  } else if (key_column == 1) {
                      if (text_length > 0)
                          text_field[--text_length] = '\0';
                  } else {
                      screen_mode = HOME_SCREEN;
                  }
              }
          }

          int main(void)
          {
              struct padButtonStatus buttons;
              u32 previous_buttons = 0;
              int redraw = 1;

              SifInitRpc(0);

              while (!SifIopReset("", 0)) { }
              while (!SifIopSync()) { }

              SifInitRpc(0);
              SifLoadFileInit();

              SifLoadModule("rom0:SIO2MAN", 0, NULL);
              SifLoadModule("rom0:PADMAN", 0, NULL);

              padInit(0);
              padPortOpen(0, 0, pad_buffer);

              init_scr();
              scr_setCursor(0);

              for (;;) {
                  u32 held_buttons = 0;
                  u32 pressed_buttons;

                  if (padGetState(0, 0) == PAD_STATE_STABLE &&
                      padRead(0, 0, &buttons) != 0) {
                      held_buttons = ((u32)(~buttons.btns)) & 0xFFFF;
                  }

                  pressed_buttons = held_buttons & ~previous_buttons;
                  previous_buttons = held_buttons;

                  /* Triangle returns home from every menu. */
                  if (pressed_buttons & PAD_TRIANGLE) {
                      screen_mode = HOME_SCREEN;
                      redraw = 1;
                  } else if (screen_mode == HOME_SCREEN) {
                      if (pressed_buttons & PAD_CIRCLE) {
                          screen_mode = MENU_SCREEN;
                          menu_selection = 0;
                          redraw = 1;
                      } else if (pressed_buttons & PAD_CROSS) {
                          screen_mode = KEYBOARD_SCREEN;
                          key_row = 0;
                          key_column = 0;
                          redraw = 1;
                      }
                  } else if (screen_mode == MENU_SCREEN) {
                      update_menu(pressed_buttons);

                      if (pressed_buttons & (PAD_UP | PAD_DOWN | PAD_CROSS))
                          redraw = 1;
                  } else {
                      update_keyboard(pressed_buttons);

                      if (pressed_buttons &
                          (PAD_UP | PAD_DOWN | PAD_LEFT | PAD_RIGHT | PAD_CROSS))
                          redraw = 1;
                  }

                  if (redraw) {
                      redraw_screen();
                      redraw = 0;
                  }
              }

              return 0;
          }
          """,
          }

          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)

              needs_write = not path.exists()

              # Replace the older generated source and Makefile if present.
              if name in ("Makefile", "src/main.c") and path.exists():
                  needs_write = (
                      "PS2_EXAMPLE_ELF_V2"
                      not in path.read_text(
                          encoding="utf-8",
                          errors="replace"
                      )
                  )

              if needs_write:
                  path.write_text(
                      content.lstrip("\n"),
                      encoding="utf-8"
                  )
                  print(f"Created/repaired {name}")
              else:
                  print(f"Kept existing {name}")

          PY

      - name: Build ELF with PS2DEV container
        shell: bash
        run: |
          set -euo pipefail

          docker pull ghcr.io/ps2dev/ps2dev:v2.0.0

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ghcr.io/ps2dev/ps2dev:v2.0.0 \
            sh -c '
              set -eu

              export PS2DEV="${PS2DEV:-/usr/local/ps2dev}"
              export PS2SDK="${PS2SDK:-$PS2DEV/ps2sdk}"
              export PATH="$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin"

              command -v mips64r5900el-ps2-elf-gcc
              test -f "$PS2SDK/samples/Makefile.pref"

              rm -f src/main.o example.elf
              make

              test -s example.elf

              mkdir -p output
              cp example.elf output/example.elf
            '

      - name: Commit project files and output/example.elf
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -- \
            .github/workflows/build.yml \
            .gitignore \
            README.md \
            Makefile \
            src/main.c \
            output/example.elf

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build PS2 example ELF [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"