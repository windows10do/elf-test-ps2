name: Build and Commit PS2 Example ELF

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "output/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PS2 Example ELF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create project files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .github/workflows src output

          # Create .gitignore without replacing an existing one.
          if [ ! -f .gitignore ]; then
            cat > .gitignore <<'EOF'
          *.o
          /example.elf
          EOF
          fi

          # Create README without replacing an existing one.
          if [ ! -f README.md ]; then
            cat > README.md <<'EOF'
          # PS2 Example ELF

          PlayStation 2 homebrew demo built with PS2SDK.

          ## Controls

          - Circle: Open the menu.
          - Cross: Open the keyboard or select a key.
          - D-pad: Navigate menus and the QWERTY keyboard.
          - Triangle: Return to the main screen from any menu.

          ## Build output

          The ELF is committed to:

          `output/example.elf`

          GitHub Actions builds the ELF and commits it directly
          to the repository.
          EOF
          fi

          # Replace the generated Makefile so old broken settings
          # do not carry over from previous workflow attempts.
          cat > Makefile <<'EOF'
          EE_BIN = example.elf
          EE_OBJS = src/main.o
          EE_LIBS = -ldebug -lpad
          EE_CFLAGS += -O2 -Wall -Wextra -G0

          all: $(EE_BIN)

          clean:
          	rm -f $(EE_OBJS) $(EE_BIN)

          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

          # Generate the complete PS2 application.
          cat > src/main.c <<'EOF'
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifrpc.h>
          #include <loadfile.h>
          #include <libpad.h>
          #include <debug.h>
          #include <string.h>

          #define SCREEN_HOME 0
          #define SCREEN_MENU 1
          #define SCREEN_KEYBOARD 2

          #define TEXT_CAPACITY 64

          static unsigned char pad_buffer[256]
              __attribute__((aligned(64)));

          static int screen = SCREEN_HOME;
          static int menu_selection = 0;

          static int key_row = 0;
          static int key_column = 0;

          static char text_field[TEXT_CAPACITY];
          static int text_length = 0;

          static const char *menu_items[] = {
              "Open QWERTY keyboard",
              "Clear text field",
              "Return home"
          };

          static const char *keyboard_rows[] = {
              "qwertyuiop",
              "asdfghjkl",
              "zxcvbnm"
          };

          static const int keyboard_lengths[] = {
              10, 9, 7, 3
          };

          static const char *keyboard_actions[] = {
              "SPACE", "DEL", "DONE"
          };

          static void draw_home(void)
          {
              scr_clear();
              scr_setXY(0, 0);

              scr_printf("Hello from example elf!\n\n");

              scr_printf("PS2 EXAMPLE ELF\n\n");

              scr_printf("TEXT FIELD:\n");
              scr_printf("> %s\n\n",
                  text_length > 0 ? text_field : "<empty>");

              scr_printf("CIRCLE  - Open menu\n");
              scr_printf("CROSS   - Open QWERTY keyboard\n");
              scr_printf("TRIANGLE - Return home\n\n");

              scr_printf("Built with PS2SDK.\n");
          }

          static void draw_menu(void)
          {
              int i;

              scr_clear();
              scr_setXY(0, 0);

              scr_printf("EXAMPLE MENU\n\n");

              for (i = 0; i < 3; i++) {
                  scr_printf("%c %s\n",
                      i == menu_selection ? '>' : ' ',
                      menu_items[i]);
              }

              scr_printf("\n");
              scr_printf("D-PAD - Navigate\n");
              scr_printf("CROSS - Select\n");
              scr_printf("TRIANGLE - Main screen\n");
          }

          static void draw_keyboard(void)
          {
              int row;
              int col;

              scr_clear();
              scr_setXY(0, 0);

              scr_printf("QWERTY KEYBOARD\n\n");

              scr_printf("TEXT FIELD:\n");
              scr_printf("> %s\n\n", text_field);

              for (row = 0; row < 3; row++) {
                  int indent = row == 0 ? 0 :
                               row == 1 ? 2 : 5;

                  for (col = 0; col < indent; col++)
                      scr_printf(" ");

                  for (col = 0;
                       col < keyboard_lengths[row];
                       col++) {

                      if (row == key_row &&
                          col == key_column) {
                          scr_printf("[%c] ",
                              keyboard_rows[row][col]);
                      } else {
                          scr_printf(" %c  ",
                              keyboard_rows[row][col]);
                      }
                  }

                  scr_printf("\n");
              }

              scr_printf("\n");

              for (col = 0; col < 3; col++) {
                  if (key_row == 3 &&
                      key_column == col) {
                      scr_printf("[%s] ",
                          keyboard_actions[col]);
                  } else {
                      scr_printf(" %s  ",
                          keyboard_actions[col]);
                  }
              }

              scr_printf("\n\n");
              scr_printf("D-PAD - Navigate\n");
              scr_printf("CROSS - Type/select\n");
              scr_printf("TRIANGLE - Main screen\n");
          }

          static void redraw(void)
          {
              if (screen == SCREEN_HOME)
                  draw_home();
              else if (screen == SCREEN_MENU)
                  draw_menu();
              else
                  draw_keyboard();
          }

          static void append_character(char ch)
          {
              if (text_length < TEXT_CAPACITY - 1) {
                  text_field[text_length] = ch;
                  text_length++;
                  text_field[text_length] = '\0';
              }
          }

          static void update_menu(u32 pressed)
          {
              if (pressed & PAD_UP) {
                  menu_selection =
                      (menu_selection + 2) % 3;
              }

              if (pressed & PAD_DOWN) {
                  menu_selection =
                      (menu_selection + 1) % 3;
              }

              if (pressed & PAD_CROSS) {
                  if (menu_selection == 0) {
                      screen = SCREEN_KEYBOARD;
                      key_row = 0;
                      key_column = 0;
                  } else if (menu_selection == 1) {
                      text_length = 0;
                      text_field[0] = '\0';
                  } else {
                      screen = SCREEN_HOME;
                  }
              }
          }

          static void update_keyboard(u32 pressed)
          {
              if (pressed & PAD_LEFT) {
                  key_column =
                      (key_column +
                       keyboard_lengths[key_row] - 1)
                      % keyboard_lengths[key_row];
              }

              if (pressed & PAD_RIGHT) {
                  key_column =
                      (key_column + 1)
                      % keyboard_lengths[key_row];
              }

              if (pressed & PAD_UP) {
                  if (key_row > 0)
                      key_row--;

                  if (key_column >= keyboard_lengths[key_row])
                      key_column =
                          keyboard_lengths[key_row] - 1;
              }

              if (pressed & PAD_DOWN) {
                  if (key_row < 3)
                      key_row++;

                  if (key_column >= keyboard_lengths[key_row])
                      key_column =
                          keyboard_lengths[key_row] - 1;
              }

              if (pressed & PAD_CROSS) {
                  if (key_row < 3) {
                      append_character(
                          keyboard_rows[key_row][key_column]
                      );
                  } else if (key_column == 0) {
                      append_character(' ');
                  } else if (key_column == 1) {
                      if (text_length > 0) {
                          text_length--;
                          text_field[text_length] = '\0';
                      }
                  } else {
                      screen = SCREEN_HOME;
                  }
              }
          }

          int main(void)
          {
              struct padButtonStatus buttons;
              u32 previous_buttons = 0;

              /* Initialize RPC and reset the IOP. */
              SifInitRpc(0);

              while (!SifIopReset("", 0)) {
              }

              while (!SifIopSync()) {
              }

              SifInitRpc(0);
              SifLoadFileInit();

              /* Load controller drivers from ROM. */
              SifLoadModule("rom0:SIO2MAN", 0, NULL);
              SifLoadModule("rom0:PADMAN", 0, NULL);

              padInit(0);
              padPortOpen(0, 0, pad_buffer);

              /* Initialize the PS2 debug text display. */
              init_scr();
              scr_setCursor(0);

              redraw();

              for (;;) {
                  u32 current_buttons = 0;
                  u32 pressed;

                  if (padGetState(0, 0) == PAD_STATE_STABLE &&
                      padRead(0, 0, &buttons) != 0) {
                      current_buttons =
                          ((u32)(~buttons.btns)) & 0xFFFF;
                  }

                  /* Detect newly pressed buttons. */
                  pressed =
                      current_buttons & ~previous_buttons;

                  previous_buttons = current_buttons;

                  /*
                   * Triangle returns to the main screen
                   * from every menu.
                   */
                  if (pressed & PAD_TRIANGLE) {
                      screen = SCREEN_HOME;
                      redraw();
                      continue;
                  }

                  if (screen == SCREEN_HOME) {
                      if (pressed & PAD_CIRCLE) {
                          screen = SCREEN_MENU;
                          menu_selection = 0;
                          redraw();
                      } else if (pressed & PAD_CROSS) {
                          screen = SCREEN_KEYBOARD;
                          key_row = 0;
                          key_column = 0;
                          redraw();
                      }
                  } else if (screen == SCREEN_MENU) {
                      update_menu(pressed);

                      if (pressed &
                          (PAD_UP | PAD_DOWN | PAD_CROSS)) {
                          redraw();
                      }
                  } else {
                      update_keyboard(pressed);

                      if (pressed &
                          (PAD_UP | PAD_DOWN |
                           PAD_LEFT | PAD_RIGHT |
                           PAD_CROSS)) {
                          redraw();
                      }
                  }
              }

              return 0;
          }
          EOF

          echo "Project files created."

      - name: Download PS2DEV toolchain
        shell: bash
        run: |
          set -euo pipefail

          docker pull ghcr.io/ps2dev/ps2dev:latest

      - name: Diagnose tools and build ELF
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            --entrypoint /bin/sh \
            ghcr.io/ps2dev/ps2dev:latest \
            -eu -c '
              echo "=== Installing build dependencies ==="

              apk add --no-cache build-base

              echo "=== Toolchain ==="

              export PS2DEV="${PS2DEV:-/usr/local/ps2dev}"
              export PS2SDK="${PS2SDK:-$PS2DEV/ps2sdk}"
              export PATH="$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin"

              echo "PS2DEV=$PS2DEV"
              echo "PS2SDK=$PS2SDK"

              command -v make
              command -v mips64r5900el-ps2-elf-gcc

              test -f "$PS2SDK/samples/Makefile.pref"
              test -f "$PS2SDK/samples/Makefile.eeglobal"

              echo "=== Building ==="

              rm -f src/main.o example.elf

              make

              echo "=== Verifying ELF ==="

              test -s example.elf

              mkdir -p output
              cp example.elf output/example.elf

              test -s output/example.elf

              echo "Build successful."
              ls -lh output/example.elf
            '

      - name: Commit project files and ELF
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -- \
            .github/workflows/build.yml \
            .gitignore \
            README.md \
            Makefile \
            src/main.c \
            output/example.elf

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build PS2 example ELF [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"